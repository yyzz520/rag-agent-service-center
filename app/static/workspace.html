<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RAG + Agent 演示台</title>
  <link rel="stylesheet" href="/static/demo.css">
</head>
<body>
  <header class="top">
    <div>
      <h1>RAG + Agent 演示台</h1>
      <p class="sub">制药企业 GMP 物料/成品仓场景 · 合成数据</p>
    </div>
    <div class="auth">
      <input id="username" value="alice" autocomplete="username" aria-label="用户名">
      <input id="password" type="password" value="alice123" autocomplete="current-password" aria-label="密码">
      <button id="loginBtn">登录</button>
      <span id="userInfo" class="muted"></span>
    </div>
  </header>

  <div class="statusbar">
    <span class="pill">后端能力演示台 · 非产品前端</span>
    <span class="pill">合成数据</span>
    <span class="pill">路由评测 14/14</span>
    <span class="pill">计划执行 5/5</span>
    <span class="pill">123 pytest</span>
    <span class="pill" id="traceId">trace: —</span>
  </div>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="rag">知识库问答</button>
    <button class="tab-btn" data-tab="agent">智能体与审批</button>
    <button class="tab-btn" data-tab="plan">计划任务</button>
  </nav>

  <main>
    <section id="tab-rag" class="tab active">
      <div class="chips">
        <button data-q="冷藏库的温控要求是什么？">冷藏库温控要求</button>
        <button data-q="偏差按影响程度分成哪几级？">偏差分级</button>
        <button data-q="清源缓释片治疗糖尿病的最佳剂量是多少？">负样本（应拒答）</button>
      </div>
      <div id="ragMessages" class="messages"></div>
      <form id="ragForm" class="composer">
        <input id="ragInput" placeholder="问文档 / 制度 / SOP…" autocomplete="off">
        <button type="submit">发送</button>
      </form>
    </section>

    <section id="tab-agent" class="tab">
      <div class="chips">
        <button data-q="批号 QS-2024-9527 的库区、批记录和放行状态">查批号状态</button>
        <button data-q="请把批号 QS-2024-6001 放行">放行（需审批）</button>
        <button data-q="请把批号 QS-2024-6100 放行">放行有偏差批次</button>
      </div>
      <div class="row">
        <button id="newAgent" class="ghost">新会话</button>
        <span class="muted">外部工具执行前会暂停，等待批准 / 拒绝</span>
      </div>
      <div id="agentMessages" class="messages"></div>
      <form id="agentForm" class="composer">
        <input id="agentInput" placeholder="问实时状态 / 发起写操作…" autocomplete="off">
        <button type="submit">发送</button>
      </form>
    </section>

    <section id="tab-plan" class="tab">
      <div class="chips">
        <button data-q="查一下批号 QS-2024-9527 的库区和放行状态，再查知识库里冷藏库的温控要求，判断存放是否合规">多步合规核对</button>
        <button data-q="对比批号 QS-2024-9527 和 QS-2024-8831 分别在哪个库区、是否放行">两批号对比</button>
      </div>
      <div class="row">
        <button id="newPlan" class="ghost">新计划</button>
        <span class="muted">先生成计划，人工批准后逐步执行</span>
      </div>
      <div id="planMessages" class="messages"></div>
      <form id="planForm" class="composer">
        <input id="planInput" placeholder="描述一个多步任务…" autocomplete="off">
        <button type="submit">生成计划</button>
      </form>
    </section>
  </main>

  <details class="debug">
    <summary>原始响应（调试用）</summary>
    <pre id="debug">—</pre>
  </details>

  <footer class="muted">
    演示环境 · 全部为合成数据 · 重置仓储状态：删除 <code>data/wms_mock.json</code> 后重新查询
  </footer>

  <script src="/static/demo.js"></script>
</body>
</html>
