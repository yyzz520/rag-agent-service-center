# 多副本入口：把请求轮转分给 app 服务的 N 个副本。
#
# 关键点是 DNS 解析方式：app 是 compose 服务名，扩容/缩容后它解析出的 IP 列表会变。
# nginx 默认只在启动时解析一次 proxy_pass 里的域名并钉死，缩容后会一直往已销毁的 IP 打。
# 所以这里必须用变量式 proxy_pass（$backend）+ resolver 指向 Docker 内嵌 DNS 127.0.0.11，
# 让 nginx 按 valid=10s 在运行时重新解析、拿到当前的副本列表。
events {}

http {
    server {
        listen 80;

        location / {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $backend app:8200;
            proxy_pass http://$backend;

            proxy_set_header Host $host;
            # 限流需要真实客户端 IP：反代重写 XFF，app 侧配 TRUST_PROXY=true 才按首跳分桶
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # SSE 流式（/rag/chat/stream、/agent/chat/stream）必须关响应缓冲：
            # 开着的话 nginx 会把事件攒在缓冲里凑够一批才下发，"逐字输出"就没了。
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
