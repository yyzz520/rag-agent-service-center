name: ci

# 临时改为手动触发：账户 billing 授权失败时 Actions 任务无法启动，
# 自动触发只会产生失败邮件和红叉。账单恢复后改回：
# on:
#   push:
#     branches: [main]
#   pull_request:
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests
      - name: Test
        run: pytest -q
      - name: Eval gate (fixture)
        run: python scripts/eval_gate.py --retrieval tests/fixtures/eval_reports.jsonl --generation tests/fixtures/gen_reports.jsonl
      - name: Secret check
        run: python scripts/check_secrets.py
      - name: Dependency audit (non-blocking)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt || true
