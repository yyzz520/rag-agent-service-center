name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests
      - name: Test
        run: pytest -q
      - name: Eval gate (fixture)
        run: python scripts/eval_gate.py --retrieval tests/fixtures/eval_reports.jsonl --generation tests/fixtures/gen_reports.jsonl
