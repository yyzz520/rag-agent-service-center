[project]
name = "rag-agent-service-center"
version = "0.4.5"
description = "Enterprise AI middle platform: RAG + Agent service center, evaluation and governance"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".venv", "data", "uploads"]

[tool.ruff.lint]
select = ["E9", "F"]
